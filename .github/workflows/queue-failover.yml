name: Intel Bottle Queue Failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: intel-bottle-queue-failover
  cancel-in-progress: false

jobs:
  failover:
    runs-on: ubuntu-latest
    steps:
      - name: Reroute untouched queued auto runs after 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_ID: build.yml
        shell: bash
        run: |
          set -euo pipefail
          # Never cancel a workflow after any bottle job has started.
          idle=$(gh api "repos/$GH_REPO/actions/runners?per_page=100" --jq '[.runners[] | select(.name == "imac-intel" and .status == "online" and .busy == false)] | length' 2>/dev/null || echo 0)
          [[ "$idle" == 1 ]] || { echo "iMac not idle; no failover"; exit 0; }
          gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs?status=queued&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/candidates.tsv" <<'PY'
          import datetime, json, re, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          for run in json.load(open(sys.argv[1])).get("workflow_runs", []):
              title = run.get("display_title", "")
              match = re.fullmatch(r"Intel Bottles \[(.*?)\] versions=\[(.*?)\] runner=\[auto\]", title)
              if not match:
                  continue
              age = (now - datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))).total_seconds()
              if age >= 600:
                  print(run["id"], match.group(1), match.group(2), sep="\t")
          PY
          while IFS=$'\t' read -r run_id formulae versions; do
            [[ -n "$run_id" ]] || continue
            jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name != "prepare") | .status')
            # A started, finished or cancelled bottle job makes full-run rerouting unsafe.
            if [[ -n "$jobs" ]] && grep -qv '^queued$' <<< "$jobs"; then
              echo "Run $run_id already has active/completed bottle jobs; skip"
              continue
            fi
            echo "Failover run $run_id ($formulae)"
            gh api -X POST "repos/$GH_REPO/actions/runs/$run_id/cancel" >/dev/null || continue
            # Wait for cancellation to settle before dispatching a replacement.
            cancelled=false
            for attempt in {1..12}; do
              status=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status')
              if [[ "$status" == completed ]]; then cancelled=true; break; fi
              sleep 5
            done
            [[ "$cancelled" == true ]] || { echo "Cancellation pending; no duplicate dispatch"; continue; }
            gh workflow run "$WORKFLOW_ID" -R "$GH_REPO" --ref main \
              -f "formulae=$formulae" -f "versions=$versions" -f runner=self-hosted -f skip_if_bottled=true
            # One fallback per watchdog execution to avoid overloading the iMac.
            break
          done < "$RUNNER_TEMP/candidates.tsv"
