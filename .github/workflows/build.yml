name: Build Intel Bottles
run-name: Intel Bottles [${{ inputs.formulae }}] versions=[${{ inputs.versions }}] runner=[${{ inputs.runner }}] skip=[${{ inputs.skip_if_bottled }}]
on:
  workflow_dispatch:
    inputs:
      formulae:
        description: 'Comma-separated formulae (leave blank for recommended batch)'
        required: false
        default: 'llvm,rust,openvino,boost,protobuf'
        type: string
      versions:
        description: 'Optional pinned versions, e.g. aria2=1.37.0_3,openssl@3=3.5.9'
        type: string
        required: false
        default: ''
      runner:
        description: 'Runner selection (auto assigns one job to idle iMac in multi-formula batches)'
        type: choice
        options:
          - auto
          - self-hosted
          - github-hosted
        default: auto
      skip_if_bottled:
        description: 'Skip formulae already bottled for Intel Sequoia'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          FORMULAE: ${{ inputs.formulae }}
          VERSIONS: ${{ inputs.versions }}
          RUNNER_MODE: ${{ inputs.runner }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: |
          local_idle=0
          if [[ -n "$RUNNER_READ_TOKEN" ]]; then
            local_idle=$(GH_TOKEN="$RUNNER_READ_TOKEN" gh api "repos/$GH_REPO/actions/runners?per_page=100" --jq '[.runners[] | select(.name == "imac-intel" and .status == "online" and .busy == false)] | length' 2>/dev/null || echo 0)
          fi
          echo "Idle iMac runners: $local_idle"
          export LOCAL_IDLE="$local_idle"
          inventory_file="$RUNNER_TEMP/imac-inventory.json"
          if [[ "$local_idle" -gt 0 ]]; then
            gh api "repos/$GH_REPO/contents/.github/runner-inventory/imac-intel.json" --jq .content 2>/dev/null | base64 -d > "$inventory_file" || true
          fi
          export INVENTORY_FILE="$inventory_file"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from datetime import datetime, timezone
          raw = os.environ.get("FORMULAE") or "llvm,rust,openvino,boost,protobuf"
          names = list(dict.fromkeys(x.strip() for x in raw.split(",") if x.strip()))
          if not names or len(names) > 20 or any(not re.fullmatch(r"[a-zA-Z0-9@+_.-]+", n) for n in names):
              raise SystemExit("Expected 1–20 comma-separated Homebrew formula names")
          requested = {}
          for pair in filter(None, (x.strip() for x in os.environ.get("VERSIONS", "").split(","))):
              if "=" not in pair:
                  raise SystemExit("Pinned versions must be formula=version pairs")
              name, version = pair.split("=", 1)
              if name not in names or not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+_~-]*", version):
                  raise SystemExit("Invalid or extraneous pinned version: " + pair)
              if name in requested:
                  raise SystemExit("Duplicate pinned version: " + name)
              requested[name] = version
          mode = os.environ.get("RUNNER_MODE") or "auto"
          if mode not in ("auto", "self-hosted", "github-hosted"):
              raise SystemExit("Invalid runner mode: " + mode)
          local = ["self-hosted", "macOS", "X64", "intel-sequoia"]
          hosted = "macos-15-intel"
          # Prefer GitHub-hosted runners, but share one formula with an idle
          # iMac for multi-formula batches. Never migrate running jobs.
          # Single-formula auto builds remain GitHub-hosted by default.
          idle = int(os.environ.get("LOCAL_IDLE", "0")) > 0
          share_local = mode == "auto" and idle and len(names) > 1
          eligible = None
          if share_local:
              try:
                  inventory = json.load(open(os.environ["INVENTORY_FILE"]))
                  timestamp = datetime.fromisoformat(inventory["updated_at"].replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - timestamp).total_seconds()
                  if inventory.get("runner") == "imac-intel" and inventory.get("schema") == 1 and 0 <= age <= 86400 and isinstance(inventory.get("formulae"), dict):
                      eligible = next((name for name in names if name not in inventory["formulae"]), None)
                  else:
                      print("iMac inventory stale or invalid; hosted-only", file=__import__("sys").stderr)
              except (OSError, ValueError, KeyError, TypeError):
                  print("iMac inventory unavailable; hosted-only", file=__import__("sys").stderr)
          entries = []
          for i, name in enumerate(names):
              use_local = mode == "self-hosted" or (share_local and name == eligible)
              target = local if use_local else hosted
              entries.append({"formula": name, "version": requested.get(name, ""), "runner": target})
          print("matrix=" + json.dumps({"include": entries}))
          PY

  bottle:
    needs: prepare
    name: ${{ matrix.formula }} [${{ matrix.version }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Environment
        run: |
          uname -m
          sw_vers
          [[ "$(uname -m)" == "x86_64" ]]
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          [[ "$(brew --prefix)" == "/usr/local" ]]
          brew config
          df -h .
      - name: Check bottle availability
        id: preflight
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          FORMULA: ${{ matrix.formula }}
          EXPECTED_VERSION: ${{ matrix.version }}
          SKIP_IF_BOTTLED: ${{ inputs.skip_if_bottled }}
        run: |
          set -euo pipefail
          brew update
          brew info --json=v2 "$FORMULA" > "$RUNNER_TEMP/formula-info.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/formula-info.json"))
          formula = data["formulae"][0]
          actual = str(formula["versions"]["stable"])
          revision = int(formula.get("revision") or 0)
          if revision:
              actual += "_" + str(revision)
          expected = os.environ.get("EXPECTED_VERSION")
          if expected and actual != expected:
              print("stale=true")
              print("skip=true")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as out:
                      out.write(f"### Stale formula version: {formula['name']}\\n\\n")
                      out.write(f"- Requested: {expected}\\n")
                      out.write(f"- Runner resolved: {actual}\\n")
                      out.write("- Result: skipped; resubmit with the current version.\\n")
              print(f"::warning::Requested {formula['name']} {expected}, but runner resolves {actual}; skipping stale build")
              raise SystemExit(0)
          print("stale=false")
          print("resolved_version=" + actual)
          files = (formula.get("bottle") or {}).get("stable", {}).get("files") or {}
          tag = "sequoia"
          # This runner is Intel macOS 15; never confuse arm64 bottles with x86_64.
          available = any(k == tag or k.startswith(tag + "_") for k in files)
          print("available=" + str(available).lower())
          print("skip=" + str(available and os.getenv("SKIP_IF_BOTTLED", "true").lower() == "true").lower())
          PY
          brew unbottled --tag=sequoia 2>&1 | head -80 || true
      - name: Guard existing local formula before dependency installation
        id: local_guard
        if: steps.preflight.outputs.skip != 'true'
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          if brew list --formula "$FORMULA" >/dev/null 2>&1; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$FORMULA is already installed on this runner; skipping without changing Homebrew"
            echo "### Skipped: $FORMULA is already installed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build dependencies and bottle
        if: steps.preflight.outputs.skip != 'true' && steps.local_guard.outputs.installed != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_MAKE_JOBS: '2'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          MAKEFLAGS: '-j2'
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          # brew bottle requires a local core tap even when API installs work.
          if ! brew tap | grep -qx 'homebrew/core'; then
            brew tap --force homebrew/core
          fi
          mkdir -p "$RUNNER_TEMP/bottles"
          cd "$RUNNER_TEMP/bottles"
          # Audit shared Homebrew state before and after the build.
          brew list --formula --versions > homebrew-before.txt
          trap 'brew list --formula --versions > "$RUNNER_TEMP/bottles/homebrew-after.txt" || true; diff -u "$RUNNER_TEMP/bottles/homebrew-before.txt" "$RUNNER_TEMP/bottles/homebrew-after.txt" > "$RUNNER_TEMP/bottles/homebrew-changes.log" || true' EXIT
          # Track existing dependencies: do not bottle pre-existing installations
          # as though they were built by this workflow.
          brew list --formula > installed-before.txt
          # Save the exact recursive dependency list before installation.
          brew deps --include-build --include-test --tree "$FORMULA" > dependency-tree.log
          brew deps --include-build --include-test "$FORMULA" | sort -u > dependency-list.txt
          # Prefer compatible official bottles; Homebrew builds dependencies from
          # source when no usable bottle exists for this Intel macOS runner.
          brew install --only-dependencies --verbose "$FORMULA" 2>&1 | tee dependencies.log
          # Record which installed dependencies have local bottle metadata.
          {
            echo "Installed dependency versions:"
            while IFS= read -r dep; do
              [[ -n "$dep" ]] || continue
              brew list --versions "$dep" || true
            done < dependency-list.txt
          } > dependency-installed.txt
          # Bottle dependencies before building the root, so they survive
          # even if the root Formula fails.
          # Preserve locally built dependencies as installable bottles where supported.
          while IFS= read -r dep; do
            [[ -n "$dep" ]] || continue
            if brew list --formula "$dep" >/dev/null 2>&1 && ! grep -Fxq "$dep" installed-before.txt; then
              echo "Bottling dependency: $dep" | tee -a dependency-bottles.log
              brew bottle --json "$dep" >> dependency-bottles.log 2>&1 || echo "Unable to bottle $dep" >> dependency-bottles.log
            fi
          done < dependency-list.txt
          # Recheck after dependencies to guard against concurrent installations.
          # Never uninstall a working formula to rebuild it.
          if brew list --formula "$FORMULA" >/dev/null 2>&1; then
            echo "Installed $FORMULA detected; refusing destructive replacement" | tee build.log
            echo "::error::Build $FORMULA on an isolated runner or uninstall manually first."
            exit 1
          fi
          brew install --build-bottle --verbose "$FORMULA" 2>&1 | tee -a build.log
          brew bottle --json "$FORMULA" 2>&1 | tee bottle.log
          shasum -a 256 ./*.tar.gz > SHA256SUMS
      - name: Upload build logs and bottles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.formula }}-intel
          path: |
            ${{ runner.temp }}/bottles/*.tar.gz
            ${{ runner.temp }}/bottles/*.json
            ${{ runner.temp }}/bottles/*.log
            ${{ runner.temp }}/bottles/*.txt
            ${{ runner.temp }}/bottles/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
      - name: Publish successful formula independently
        if: always() && steps.preflight.outcome == 'success' && steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: bottles-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.formula }}
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/bottles" ]]; then
            echo "No dependency archives were produced"
            exit 0
          fi
          cd "$RUNNER_TEMP/bottles"
          shopt -s nullglob
          assets=()
          for metadata in *.bottle.json; do
            archive=$(python3 - "$metadata" <<'PY'
          import json,sys
          obj = next(iter(json.load(open(sys.argv[1])).values()))
          print(obj["bottle"]["tags"]["sequoia"]["local_filename"])
          PY
            )
            if [[ -f "$archive" ]]; then
              assets+=("$archive" "$metadata")
            fi
          done
          [[ ${#assets[@]} -gt 0 ]] || { echo "No valid Bottle+JSON pairs to publish"; exit 0; }
          bottles=()
          for asset in "${assets[@]}"; do
            if [[ "$asset" == *.tar.gz ]]; then
              bottles+=("$asset")
            fi
          done
          shasum -a 256 "${bottles[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          gh release create "$TAG" "${assets[@]}" \
            --title "Intel Sequoia Bottles: $FORMULA" \
            --notes "Built by GitHub Actions run $GITHUB_RUN_ID on macos-15-intel. May include partial dependency bottles when the root job fails. Consult workflow logs for root status." \
            --latest=false
